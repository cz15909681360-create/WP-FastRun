plugins {
    id "com.android.application"
}

def enableMaps = providers.gradleProperty("enableMaps").getOrElse("false").toBoolean()


def keyProperties = new Properties()
if(rootProject.file("local.properties").exists()) rootProject.file("local.properties").withInputStream { keyProperties.load(it) }
def tencentKey = providers.gradleProperty("TENCENT_MAP_KEY").getOrElse(keyProperties.getProperty("TENCENT_MAP_KEY", ""))

android {
    ndkVersion = '26.2.11394342'
    compileSdk = 36
    buildToolsVersion = '36.0.0'
    namespace = 'com.zcshou.gogogo'

    def signingProperties = new Properties()
    def signingFile = rootProject.file("signing.properties")
    if (signingFile.exists()) signingFile.withInputStream { signingProperties.load(it) }
    signingConfigs {
        if (signingFile.exists()) {
            localRelease {
                storeFile rootProject.file(signingProperties.getProperty("storeFile"))
                storePassword signingProperties.getProperty("storePassword")
                keyAlias signingProperties.getProperty("keyAlias")
                keyPassword signingProperties.getProperty("keyPassword")
            }
        }
    }

    defaultConfig {
        applicationId "com.zcshou.yinsuo.replay"
        buildConfigField "boolean", "ENABLE_MAPS", enableMaps.toString()
        buildConfigField "String", "MAPS_API_KEY", groovy.json.JsonOutput.toJson(keyProperties.getProperty("MAPS_API_KEY", ""))
        buildConfigField "String", "MAPS_SAFE_CODE", groovy.json.JsonOutput.toJson(keyProperties.getProperty("MAPS_SAFE_CODE", ""))
        minSdkVersion 27
        //noinspection ExpiredTargetSdkVersion
        targetSdkVersion 32
        versionCode 1130
        versionName '1.12.10' // https://semver.org/lang/zh-CN/
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        resourceConfigurations += ['zh', 'zh-rCN', 'en', 'en-rUS']
        ndk {
            //noinspection ChromeOsAbiSupport
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            if (signingFile.exists()) signingConfig = signingConfigs.localRelease
            // Enables code shrinking, obfuscation, and optimization for only
            // your project's release build type.
            minifyEnabled = true

            // Enables resource shrinking, which is performed by the
            // Android Gradle plugin.
            shrinkResources = true

            // Includes the default ProGuard rules files that are packaged with
            // the Android Gradle plugin. To learn more, go to the section about
            // R8 configuration files.
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            multiDexEnabled = true
        }
        debug {
            signingConfig = signingConfigs.debug
        }
    }

    // 要存取 secret value 必須要使用到一個 BuildScript 的類別，默认会从 local.properties 中获取
    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packagingOptions {
        jniLibs {
            excludes += ['lib/armeabi/**']

        }
        resources {
            excludes += ['lib/armeabi/**']
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = []
        }
    }

    defaultConfig { manifestPlaceholders = [TENCENT_MAP_KEY: tencentKey] }
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    // 指定输出的可执行程序的名字
    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            def outputFile = output.outputFile
            if (outputFile != null && outputFile.name.endsWith('.apk')) {
                def fileName
                if (variant.buildType.name == 'release') {
                    fileName = "Go_${defaultConfig.versionName}_arm64-v8a_release.apk"
                } else {
                    fileName = "Go_${defaultConfig.versionName}_arm64-v8a_debug.apk"
                }
                outputFileName=fileName
            }
        }
    }
}

dependencies {
    implementation 'com.tencent.map:tencent-map-vector-sdk:6.15.1.261013.3d797fb0.242708926'
    implementation 'com.tencent.openmap:foundation:0.9.1.6875646-pro'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.6.21'

    implementation fileTree(include: ['*.jar'], dir: 'libs')
    // AppCompat 1.5.1 开始显式依赖于 Lifecycle 2.5.1 和 SavedState 1.2.0
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.5.1'
    implementation 'androidx.appcompat:appcompat:1.5.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.7.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.elvishew:xlog:1.11.1'
    implementation 'io.noties.markwon:core:4.6.2'
    implementation files('libs/BaiduLBS_Android.jar')
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation('androidx.test.espresso:espresso-core:3.7.0', {
        exclude group: 'com.android.support', module: 'support-annotations'
    })
}
